name: Auto Reels Creator & Discord Delivery

on:
  schedule:
    # 2시간마다 자동 실행 (원하는 시간 간격으로 조정 가능)
    - cron: '0 */2 * * *'
  workflow_dispatch: # 깃허브 웹에서 'Run workflow' 버튼으로 즉시 수동 실행 가능

jobs:
  build-and-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 코드를 클라우드로 체크아웃
        uses: actions/checkout@v4

      - name: 2. 파이썬 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. FFmpeg 비디오 엔진 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 4. 필수 파이썬 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp pillow requests deep-translator numpy instagrapi discord.py

      - name: 5. 릴스 자동 탐색 및 디스코드 배달 실행
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
          AUTO_INSTAGRAM_UPLOAD: "true"
        run: |
          python auto_delivery.py

      - name: 6. 중복 방지 기록 저장 (Git Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_videos.json
          git commit -m "chore: update processed videos [skip ci]" || echo "No changes to commit"
          git push
